name: CI

on:
  push:
    branches: [main, develop, deploy]
  pull_request:
    branches: [main, develop, deploy]
  workflow_dispatch:
  schedule:
    - cron: '11 6 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: CI audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit all dependencies
        run: pnpm audit --audit-level high

  quality:
    name: CI quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.28.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated API types are up to date
        run: |
          pnpm api:generate
          git diff --exit-code -- src/services/generated
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm exec tsc -b
      # `test:coverage` já roda a suíte inteira e falha se um teste falhar.
      - name: Test application with coverage
        run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Validates that the front-end image builds and that the full compose file
  # (front + back-end submodule) is valid. Starting the whole stack is too slow for CI.
  docker:
    name: CI docker
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - name: Validate docker compose file
        run: docker compose config --quiet
      - name: Build front-end image
        run: docker build --build-arg VITE_API_URL=http://localhost:3000 -t front-viaja-junto:ci .

  # Preserve the existing required context until every protected branch uses the new checks.
  # A skipped dependent job counts as successful for branch protection, so run it after failures.
  legacy-required-check:
    name: Lint, type-check, test & build
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [audit, quality, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require audit, quality and docker
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$AUDIT_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$DOCKER_RESULT" = success
